name: desktop

# Builds the Tauri desktop app for macOS (arm64) and Windows (x64).
#
# The app ships its own Node runtime (see scripts/prepare-desktop-runtime.mjs),
# so each OS installs dependencies natively, builds the vinext bundle, then packs
# the result into the installer for that platform.
#
# Triggers: manual run, version tags, and pushes touching the desktop shell.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop-runtime.mjs"
      - ".github/workflows/desktop.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop-runtime.mjs"
      - ".github/workflows/desktop.yml"

# A tag push should not be cancelled by a branch push on the same ref.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  bundle:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: resume-studio-macos-arm64
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: resume-studio-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build web app (vinext)
        run: npm run build

      - name: Assemble bundled Node runtime
        run: node scripts/prepare-desktop-runtime.mjs --skip-build

      - name: Build desktop bundle
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Resume Studio.app" "Resume Studio.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            Resume Studio.app.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
