name: desktop

# Builds the Tauri desktop app for macOS (arm64) and Windows (x64).
#
# The app ships its own Node runtime (see scripts/prepare-desktop-runtime.mjs),
# so each OS installs dependencies natively, builds the vinext bundle, then packs
# the result into the installer for that platform.
#
# Triggers: manual run, version tags, and every push to master/main —
# each push resolves a version (auto patch-bump), tags it and publishes a
# GitHub Release with the installers. PRs still build without tagging.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop-runtime.mjs"
      - ".github/workflows/desktop.yml"

# A tag push should not be cancelled by a branch push on the same ref.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  # Every push to master/main releases: if the package.json version has been
  # released already, bump patch; otherwise release it as-is. The tag feeds
  # the bundle and release jobs. PRs and manual tag pushes pass through.
  version:
    name: resolve + tag version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tagged: ${{ steps.calc.outputs.tagged }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version
        id: calc
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CUR="$(node -p "require('./package.json').version")"
          if [[ "$EVENT" == "pull_request" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT" == "pull_request" ]]; then
              echo "tagged=false" >> "$GITHUB_OUTPUT"
            else
              echo "tagged=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            NEW="$(npm version patch --no-git-tag-version)"
            NEW="${NEW#v}"
            npm run version:sync
            git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src/mcp/config.ts
            git commit -m "chore(release): v$NEW [skip ci]"
            git tag "v$NEW"
            git push origin HEAD:master "refs/tags/v$NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          else
            git tag "v$CUR"
            git push origin "refs/tags/v$CUR"
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.label }}
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: resume-studio-macos-arm64
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: resume-studio-windows-x64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tagged == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build web app (vinext)
        run: npm run build

      - name: Assemble bundled Node runtime
        run: node scripts/prepare-desktop-runtime.mjs --skip-build

      - name: Build desktop bundle
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Prove the *packaged* app boots, not just the assembled runtime dir.
      # Run from a copy outside the repo so Node cannot borrow project node_modules.
      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Resume Studio.app"
          rm -rf /tmp/appcheck && mkdir -p /tmp/appcheck
          cp -R "$APP" /tmp/appcheck/
          "/tmp/appcheck/Resume Studio.app/Contents/MacOS/resume-studio-desktop" > /tmp/app.log 2>&1 &
          APP_PID=$!
          PORT=""
          for _ in $(seq 1 60); do
            PORT=$(grep -oE '127\.0\.0\.1:[0-9]+' /tmp/app.log | head -1 | cut -d: -f2 || true)
            if [ -n "$PORT" ] && curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ -z "$PORT" ] || ! curl -fsS "http://127.0.0.1:$PORT/api/health"; then
            echo "::error::packaged app did not boot"
            echo "--- app log ---"; cat /tmp/app.log || true
            echo "--- server log ---"; cat "$HOME/Library/Application Support/dev.linzhiyuan.resume-studio/server.log" || true
            exit 1
          fi
          echo "packaged app boots on 127.0.0.1:$PORT"
          kill "$APP_PID" 2>/dev/null || true

      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Resume Studio.app" "app.zip"

      # 统一产物名：ResumeStudio-v<版本>-<平台>[-setup|-app].[ext]
      - name: Normalize asset names
        if: runner.os == 'macOS'
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          mv "$B/dmg/Resume Studio_${VER}_aarch64.dmg" "ResumeStudio-v${VER}-macOS-arm64.dmg"
          mv app.zip "ResumeStudio-v${VER}-macOS-arm64-app.zip"

      - name: Normalize asset names
        if: runner.os == 'Windows'
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          B="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          mv "$B/Resume Studio_${VER}_x64-setup.exe" "ResumeStudio-v${VER}-windows-x64-setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ResumeStudio-v*

  # Tag pushes (v*) publish a GitHub Release with every platform installer.
  release:
    name: publish release
    needs: [version, bundle]
    if: needs.version.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes shells out to git, and needs history
      # to diff against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version.outputs.version }}"
          # .app.zip 只留 Actions artifacts，不进 Release
          mapfile -d '' FILES < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no installers found in artifacts"
            find dist -type f | head -20
            exit 1
          fi
          printf 'attaching:\n%s\n' "${FILES[@]}"
          gh release create "$TAG" "${FILES[@]}" \
            --title "Resume Studio ${TAG}" \
            --generate-notes \
            --verify-tag
