[package]
name = "resume-studio-desktop"
version = "2.3.7"
description = "Resume Studio desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
# Thin LTO keeps CI bundle builds fast; the Rust side is a shell around a
# bundled Node runtime, so fat-LTO size wins are not worth serialized codegen.
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
